<svg xmlns="http://www.w3.org/2000/svg" viewBox="40 15 920 620" width="100%" height="100%">
  <!-- Definitions for Markers and Styles -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2C3E50" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#B45309" />
    </marker>
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="105%" height="103%" fill="#F8FAFC" />

  <!-- TITLE -->
  <text x="500" y="40" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="bold" fill="#1E293B">MVS Catalog, DASD Volume &amp; Tape Relationships</text>

  <!-- ==================== LAYER 1: MASTER CATALOG ==================== -->
  <rect x="350" y="80" width="300" height="70" rx="6" fill="#1E3A8A" stroke="#172554" stroke-width="2" filter="url(#drop-shadow)" />
  <text x="500" y="110" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF">SYSTEM MASTER CATALOG</text>
  <text x="500" y="132" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" fill="#93C5FD">Contains System Datasets &amp; Aliases</text>

  <!-- ==================== LAYER 2: ALIASES ==================== -->
  <!-- Left Path (Alias A) -->
  <path d="M 450 150 L 450 190 L 150 190 L 150 250" fill="none" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="105" y="178" width="90" height="24" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
  <text x="150" y="195" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">Alias: PROD</text>

  <!-- Middle Path (Alias B) -->
  <path d="M 500 150 L 500 250" fill="none" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="455" y="178" width="90" height="24" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
  <text x="500" y="195" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">Alias: TEST</text>

  <!-- Right Path (Alias C) -->
  <path d="M 550 150 L 550 190 L 850 190 L 850 250" fill="none" stroke="#2C3E50" stroke-width="2" marker-end="url(#arrow)" />
  <rect x="805" y="178" width="90" height="24" rx="4" fill="#E2E8F0" stroke="#94A3B8" stroke-width="1" />
  <text x="850" y="195" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="bold" fill="#334155">Alias: USER</text>


  <!-- ==================== LAYER 3: USER CATALOGS ==================== -->
  <!-- User Catalog 1 -->
  <rect x="60" y="250" width="180" height="80" rx="6" fill="#0EA5E9" stroke="#0369A1" stroke-width="2" filter="url(#drop-shadow)" />
  <text x="150" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">USER CATALOG 1</text>
  <text x="150" y="305" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#E0F2FE">UCAT.PRODUCTION</text>

  <!-- User Catalog 2 -->
  <rect x="410" y="250" width="180" height="80" rx="6" fill="#0EA5E9" stroke="#0369A1" stroke-width="2" filter="url(#drop-shadow)" />
  <text x="500" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">USER CATALOG 2</text>
  <text x="500" y="305" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#E0F2FE">UCAT.TESTING</text>

  <!-- User Catalog 3 -->
  <rect x="760" y="250" width="180" height="80" rx="6" fill="#0EA5E9" stroke="#0369A1" stroke-width="2" filter="url(#drop-shadow)" />
  <text x="850" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">USER CATALOG 3</text>
  <text x="850" y="305" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" fill="#E0F2FE">UCAT.USERS</text>


  <!-- ==================== LAYER 4: FIXED POINTERS ==================== -->
  <!-- UCAT 1 Pointers (to Vol 1 and Vol 2) -->
  <path d="M 120 330 L 120 440" fill="none" stroke="#64748B" stroke-dasharray="4 4" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 150 330 L 150 365 L 340 365 L 340 440" fill="none" stroke="#64748B" stroke-dasharray="4 4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- UCAT 2 Pointers FIXED: Points straight down into Volume 2 and over into Tape Volume -->
  <path d="M 440 330 L 440 350 L 375 350 L 375 440" fill="none" stroke="#64748B" stroke-dasharray="4 4" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 500 330 L 500 365 L 590 365 L 590 440" fill="none" stroke="#B45309" stroke-width="2" marker-end="url(#arrow-orange)" />

  <!-- UCAT 3 Pointers FIXED: Points over into Volume 2 and straight down into Volume 3 -->
  <path d="M 800 330 L 800 385 L 400 385 L 400 440" fill="none" stroke="#64748B" stroke-dasharray="4 4" stroke-width="1.5" marker-end="url(#arrow)" />
  <path d="M 850 330 L 850 440" fill="none" stroke="#64748B" stroke-dasharray="4 4" stroke-width="1.5" marker-end="url(#arrow)" />


  <!-- ==================== LAYER 5: PHYSICAL STORAGE UNITS ==================== -->
  <!-- Volume 1 (DASD) -->
  <g transform="translate(60, 440)">
    <ellipse cx="65" cy="20" rx="65" ry="18" fill="#CBD5E1" stroke="#475569" stroke-width="2" />
    <path d="M 0 20 L 0 100 A 65 18 0 0 0 130 100 L 130 20 Z" fill="#E2E8F0" stroke="#475569" stroke-width="2" />
    <path d="M 0 45 A 65 15 0 0 0 130 45" fill="none" stroke="#94A3B8" stroke-width="1" />
    <path d="M 0 70 A 65 15 0 0 0 130 70" fill="none" stroke="#94A3B8" stroke-width="1" />
    <text x="65" y="55" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">VOLUME 1</text>
    <text x="65" y="75" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569" letter-spacing="1">VOLSER01</text>
  </g>

  <!-- Volume 2 (DASD) -->
  <g transform="translate(290, 440)">
    <ellipse cx="65" cy="20" rx="65" ry="18" fill="#CBD5E1" stroke="#475569" stroke-width="2" />
    <path d="M 0 20 L 0 100 A 65 18 0 0 0 130 100 L 130 20 Z" fill="#E2E8F0" stroke="#475569" stroke-width="2" />
    <path d="M 0 45 A 65 15 0 0 0 130 45" fill="none" stroke="#94A3B8" stroke-width="1" />
    <path d="M 0 70 A 65 15 0 0 0 130 70" fill="none" stroke="#94A3B8" stroke-width="1" />
    <text x="65" y="55" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">VOLUME 2</text>
    <text x="65" y="75" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569" letter-spacing="1">VOLSER02</text>
  </g>

  <!-- TAPE VOLUME -->
  <g transform="translate(520, 440)">
    <rect width="140" height="100" rx="8" fill="#F59E0B" stroke="#B45309" stroke-width="2" filter="url(#drop-shadow)" />
    <!-- Tape Reel Left Window -->
    <circle cx="40" cy="50" r="22" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" />
    <circle cx="40" cy="50" r="8" fill="#D97706" />
    <!-- Tape Reel Right Window -->
    <circle cx="100" cy="50" r="22" fill="#FFFBEB" stroke="#D97706" stroke-width="1.5" />
    <circle cx="100" cy="50" r="8" fill="#D97706" />
    <!-- Label -->
    <rect x="25" y="12" width="90" height="14" fill="#FFFFFF" stroke="#D97706" stroke-width="1" />
    <text x="70" y="23" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="bold" fill="#B45309" letter-spacing="0.5">TAPE: TAPE01</text>
    <text x="70" y="90" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#FFFFFF">TAPE VOLUME</text>
  </g>

  <!-- Volume 3 (DASD) -->
  <g transform="translate(760, 440)">
    <ellipse cx="65" cy="20" rx="65" ry="18" fill="#CBD5E1" stroke="#475569" stroke-width="2" />
    <path d="M 0 20 L 0 100 A 65 18 0 0 0 130 100 L 130 20 Z" fill="#E2E8F0" stroke="#475569" stroke-width="2" />
    <path d="M 0 45 A 65 15 0 0 0 130 45" fill="none" stroke="#94A3B8" stroke-width="1" />
    <path d="M 0 70 A 65 15 0 0 0 130 70" fill="none" stroke="#94A3B8" stroke-width="1" />
    <text x="65" y="55" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="bold" fill="#1E293B">VOLUME 3</text>
    <text x="65" y="75" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="bold" fill="#475569" letter-spacing="1">VOLSER03</text>
  </g>

  <!-- Description notes -->
  <text x="500" y="585" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#64748B">* Note: Dotted lines show that data sets tracked by a single User Catalog can reside on any physical volume.</text>
  <text x="500" y="605" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-style="italic" fill="#B45309" font-weight="bold">* User Catalog 2 tracks a tape data set located on the external tape volume (TAPE01).</text>
</svg>
